[project]
name = "quran-asr-streaming"
version = "0.1.0"
description = "Fine-tune NVIDIA Nemotron-like streaming ASR models on Quran Tadabur dataset using NeMo toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "datasets>=4.8.5",
    "cloudpickle>=3.1.2",
    "braceexpand>=0.1.7",
    "einops>=0.8.2",
    "fiddle>=0.3.0",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.34.0,<1.0",
    "kaldialign<=0.9.1",
    "librosa>=0.11.0",
    "lhotse>=1.33.0",
    "omegaconf>=2.3.0",
    "nemo-toolkit[asr]>=2.7.3",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyannote.core>=6.0.1",
    "nv-one-logger-core==2.3.1",
    "nv-one-logger-pytorch-lightning-integration==2.3.1",
    "nv-one-logger-training-telemetry==2.3.1",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=4.57.0,<4.58.dev0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Install torch from PyTorch index with CUDA 12.6
find-links = ["https://download.pytorch.org/whl/cu126"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
